<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Metropolis — 2.5D Cooperative Multiplayer City Builder</title>
  <meta name="description" content="Cooperative 2.5D Multiplayer City Builder (1-4 Players) built with Three.js and WebRTC. Build thriving cities with friends offline or online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="c" aria-label="City Viewport"></canvas>

  <!-- Top Bar / Navigation -->
  <header id="top-bar">
    <div class="brand">
      <span class="brand-badge">2.5D</span>
      <h1 class="brand-title">POCKET METROPOLIS</h1>
    </div>

    <!-- Perspective Mode Selector -->
    <div class="cam-modes">
      <button class="pastel-btn active" data-cam="iso" id="btn-cam-iso" title="Isometric 2.5D Builder View">2.5D ISOMETRIC</button>
      <button class="pastel-btn" data-cam="third" id="btn-cam-third" title="Third-Person Citizen Follow">3RD PERSON</button>
      <button class="pastel-btn" data-cam="first" id="btn-cam-first" title="First-Person Street Walker">1ST PERSON</button>
    </div>

    <!-- Action Controls -->
    <div class="top-actions">
      <button class="pastel-pill-btn" id="btn-pixel-fx" title="Toggle 2.5D Pixel Rendering">PIXEL: OFF</button>
      <button class="pastel-pill-btn" id="btn-day-night" title="Toggle Day / Night Lighting">DAY</button>
      <button class="pastel-pill-btn" id="btn-sfx" title="Sound Effects">SFX: OFF</button>
      <button class="pastel-pill-btn" id="btn-voice" title="Live Voice Chat (Microphone)" hidden>MIC: OFF</button>
      <button class="pastel-btn primary" id="btn-mp-open" title="Multiplayer Lobby (1-4 Players)">MULTIPLAYER</button>
    </div>
  </header>

  <!-- In-Game Stats HUD -->
  <div id="stats-hud">
    <div class="stat-item"><span class="stat-lbl">CITIZENS</span><span class="stat-val" id="hud-pop">0</span></div>
    <div class="stat-item"><span class="stat-lbl">TREASURY</span><span class="stat-val amber" id="hud-coins">1,000 C</span></div>
    <div class="stat-item"><span class="stat-lbl">HAPPINESS</span><span class="stat-val sage" id="hud-happy">100%</span></div>
    <div class="stat-item"><span class="stat-lbl">GRID PARCEL</span><span class="stat-val" id="hud-coord">X: 0, Z: 0</span></div>
  </div>

  <!-- Mobile Virtual Touch Joystick (Shown in 1st/3rd Person on touch devices) -->
  <div id="joystick-zone" class="joystick-zone hidden">
    <div id="joystick-thumb" class="joystick-thumb"></div>
  </div>

  <!-- Structure Placement Dock / Palette (Bottom) -->
  <nav id="palette-dock">
    <div class="palette-categories">
      <button class="cat-btn active" data-cat="roads">ROADS</button>
      <button class="cat-btn" data-cat="buildings">BUILDINGS</button>
      <button class="cat-btn" data-cat="parks">PARKS & NATURE</button>
      <button class="cat-btn" data-cat="pavement">PLAZAS</button>
    </div>
    <div class="palette-items" id="palette-items"></div>
    <div class="palette-actions">
      <button class="pastel-btn" id="btn-rotate" title="Rotate Structure [R]">ROTATE [R]</button>
      <button class="pastel-btn danger" id="btn-demolish" title="Bulldozer Tool [X]">BULLDOZE [X]</button>
    </div>
  </nav>

  <!-- Multiplayer Modal Dialog (1-4 Players Mesh) -->
  <div id="mp-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title">COOPERATIVE MULTIPLAYER (1-4 PLAYERS)</h2>
        <button class="modal-close" id="mp-close-btn" aria-label="Close">✕</button>
      </div>

      <div class="modal-body">
        <p class="modal-sub">Build together across peers with real-time grid synchronization and optional WebRTC voice chat.</p>
        
        <div class="mp-section">
          <label class="field-label">HOST A CITY ROOM</label>
          <button class="pastel-btn primary full" id="mp-create-btn">CREATE NEW ROOM</button>
          
          <div id="mp-room-info" class="mp-room-info" hidden>
            <div class="room-code-lbl">SHARE CODE WITH UP TO 3 FRIENDS</div>
            <div class="room-code-val" id="mp-room-code">-----</div>
            <div class="room-status"><span class="pulse-dot"></span> Waiting for builders to connect...</div>
            <button class="pastel-btn full" id="mp-copy-link-btn">COPY INVITE LINK</button>
          </div>
        </div>

        <div class="mp-divider"><span>OR</span></div>

        <div class="mp-section">
          <label class="field-label">JOIN AN EXISTING CITY</label>
          <div class="row">
            <input type="text" id="mp-input-code" maxlength="5" placeholder="ROOM CODE" autocomplete="off" spellcheck="false">
            <button class="pastel-btn" id="mp-join-btn">JOIN ROOM</button>
          </div>
        </div>

        <div id="mp-peers-box" class="mp-peers-box" hidden>
          <label class="field-label">CONNECTED BUILDERS (VOICE ACTIVE)</label>
          <div id="mp-peers-list" class="peers-list"></div>
          <button class="pastel-btn danger full" id="mp-leave-btn" style="margin-top: 12px;">LEAVE CITY & EXIT</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- App Bundle -->
  <script src="app.bundle.js"></script>
</body>
</html>
